<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>親師溝通非語言分析器</title>
    <script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            margin: 0;
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .video-section, .audio-section, .gesture-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        
        #stopBtn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        }
        
        video {
            width: 100%;
            max-width: 450px;
            height: auto;
            min-height: 300px;
            border: 2px solid #667eea;
            border-radius: 10px;
            margin-bottom: 15px;
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            -moz-transform: rotateY(180deg);
        }
        
        canvas {
            position: absolute;
            border-radius: 10px;
            pointer-events: none;
        }
        
        .video-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        
        .emotion-result, .gesture-result {
            font-size: 1.1em;
            color: #333;
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        
        .gesture-indicators {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        .indicator-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        
        .indicator-card.active {
            background: #ffe6e6;
            border-left-color: #ff4757;
        }
        
        .indicator-card.good {
            background: #e6ffe6;
            border-left-color: #2ed573;
        }
        
        .audio-features {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .feature-item {
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .feature-value {
            font-weight: bold;
            color: #764ba2;
        }
        
        .volume-bar, .confidence-bar {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .volume-fill, .confidence-fill {
            height: 100%;
            background: linear-gradient(to right, #4CAF50, #FFC107, #FF5722);
            transition: width 0.1s;
            border-radius: 10px;
        }
        
        .communication-analysis {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }
        
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .analysis-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .confidence-meter {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .confidence-fill {
            height: 100%;
            background: #4CAF50;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 10px;
            color: #0066cc;
            font-weight: bold;
        }
        
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .gesture-output-canvas {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            -moz-transform: rotateY(180deg);
            pointer-events: none;
            border-radius: 10px;
            z-index: 2;
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭🎙️✋ 親師溝通非語言分析器</h1>
        
        <div class="controls">
            <button id="startBtn">🚀 開始綜合分析</button>
            <button id="stopBtn" disabled>⏹️ 停止分析</button>
        </div>
        
        <div id="status" class="status">狀態：未開始</div>
        
        <div class="main-content">
            <!-- 表情分析區域 -->
            <div class="video-section">
                <h3>📹 表情分析</h3>
                <div class="video-container">
                    <video id="video" autoplay muted></video>
                </div>
                <div id="faceResult" class="emotion-result">等待攝影機啟動...</div>
            </div>
            
            <!-- 語音分析區域 -->
            <div class="audio-section">
                <h3>🎤 語音分析</h3>
                <div class="audio-features">
                    <div class="feature-item" id="volume">
                        🔊 音量級別: <span class="feature-value">0</span>
                        <div class="volume-bar">
                            <div class="volume-fill" id="volumeFill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="feature-item" id="pitch">🎵 主頻率: <span class="feature-value">N/A</span> Hz</div>
                    <div class="feature-item" id="voiceActivity">🗣️ 語音活動: <span class="feature-value">否</span></div>
                    <div class="feature-item" id="voiceMood">😌 語音情緒: <span class="feature-value">平靜</span></div>
                </div>
            </div>
            
            <!-- 手勢分析區域 -->
            <div class="gesture-section">
                <h3>✋ 肢體語言分析</h3>
                <div id="gestureResult" class="gesture-result">等待手勢檢測...</div>
                
                <div class="gesture-indicators">
                    <div class="indicator-card" id="armsIndicator">
                        <div>🤗 手臂姿態</div>
                        <div id="armsStatus">開放</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" id="armsConfidence" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="indicator-card" id="postureIndicator">
                        <div>🧍 整體姿態</div>
                        <div id="postureStatus">專業</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" id="postureConfidence" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="indicator-card" id="handsIndicator">
                        <div>👐 手掌狀態</div>
                        <div id="handsStatus">開放</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" id="handsConfidence" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="indicator-card" id="engagementIndicator">
                        <div>💬 參與度</div>
                        <div id="engagementStatus">良好</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" id="engagementConfidence" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 綜合分析區域 -->
            <div class="communication-analysis">
                <h3>🧠 親師溝通效果評估</h3>
                <div id="fusionResult">正在等待數據...</div>
                
                <div class="analysis-grid">
                    <div class="analysis-card">
                        <h4>😊 親和力指數</h4>
                        <div id="friendlinessScore">0%</div>
                        <div class="confidence-meter">
                            <div class="confidence-fill" id="friendlinessMeter" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="analysis-card">
                        <h4>🤝 專業度指數</h4>
                        <div id="professionalScore">0%</div>
                        <div class="confidence-meter">
                            <div class="confidence-fill" id="professionalMeter" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="analysis-card">
                        <h4>👂 傾聽態度</h4>
                        <div id="listeningScore">0%</div>
                        <div class="confidence-meter">
                            <div class="confidence-fill" id="listeningMeter" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="analysis-card">
                        <h4>🎯 整體溝通效果</h4>
                        <div id="overallScore">0%</div>
                        <div class="confidence-meter">
                            <div class="confidence-fill" id="overallMeter" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            GestureRecognizer,
            FilesetResolver,
            DrawingUtils
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // DOM 元素
        const video = document.getElementById("video");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const statusDiv = document.getElementById("status");
        const faceResult = document.getElementById("faceResult");
        const gestureResult = document.getElementById("gestureResult");
        const volumeDiv = document.getElementById("volume");
        const pitchDiv = document.getElementById("pitch");
        const voiceActivityDiv = document.getElementById("voiceActivity");
        const voiceMoodDiv = document.getElementById("voiceMood");
        const volumeFill = document.getElementById("volumeFill");
        const fusionResult = document.getElementById("fusionResult");

        // 語音分析變數
        let audioContext, sourceNode, analyser, dataArray, bufferLength, audioStream;
        let animationId;
        let volumeHistory = [], pitchHistory = [], energyHistory = [];
        const historyLength = 30;

        // 表情分析變數
        let faceDetectionInterval;
        let faceCanvas;

        // 手勢分析變數 - 使用 MediaPipe Tasks Vision
        let gestureRecognizer;
        let gestureCanvas;
        let runningMode = "VIDEO";
        let lastVideoTime = -1;
        let gestureDetectionActive = false;

        // 分析數據
        let currentFaceEmotion = { emotion: 'neutral', confidence: 0 };
        let currentVoiceEmotion = { emotion: 'calm', energy: 0, volume: 0 };
        let currentGestureData = {
            armsCrossed: false,
            postureOpen: true,
            handsVisible: true,
            confidenceLevel: 0,
            detectedGesture: null
        };

        // 開始分析
        startBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = '🚀 正在啟動攝影機和麥克風...';
                
                // 同時獲取攝影機和麥克風權限
                const [videoStream, micStream] = await Promise.all([
                    navigator.mediaDevices.getUserMedia({ video: true }),
                    navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: false,
                            autoGainControl: false,
                            sampleRate: 44100
                        }
                    })
                ]);

                // 載入模型
                statusDiv.textContent = '📦 正在載入AI模型...';
                
                // 先載入表情分析模型（必需的）
                await loadFaceModels();
                
                // 初始化表情檢測（優先啟動）
                await initFaceDetection(videoStream);
                await initVoiceAnalysis(micStream);
                
                // 手勢檢測在背景載入
                loadGestureModels().then(gestureLoaded => {
                    if (gestureLoaded && gestureRecognizer) {
                        initGestureDetection().then(() => {
                            statusDiv.textContent = '✅ 所有功能已啟用 - 包含手勢檢測';
                            statusDiv.className = 'status success';
                        });
                    } else {
                        statusDiv.textContent = '✅ 表情和語音分析已啟用';
                        statusDiv.className = 'status warning';
                    }
                }).catch(err => {
                    console.warn('手勢模型載入失敗:', err);
                    statusDiv.textContent = '✅ 表情和語音分析已啟用';
                    statusDiv.className = 'status warning';
                });
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                
            } catch (err) {
                statusDiv.textContent = `❌ 錯誤：${err.message}`;
                console.error('初始化失敗:', err);
            }
        });

        // 停止分析
        stopBtn.addEventListener('click', () => {
            stopAllAnalysis();
        });

        // 載入 Face API 模型
        async function loadFaceModels() {
            statusDiv.textContent = '📦 正在載入表情分析模型...';
            
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights'),
                faceapi.nets.faceExpressionNet.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights')
            ]);
        }

        // 載入 MediaPipe 手勢模型（新版本）
        async function loadGestureModels() {
            statusDiv.textContent = '📦 正在載入手勢分析模型...';
            
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                
                gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                        delegate: "GPU"
                    },
                    runningMode: runningMode,
                    numHands: 2
                });
                
                statusDiv.textContent = '✅ 手勢模型載入完成';
                console.log('手勢識別器載入成功');
                return true;
                
            } catch (error) {
                console.warn('手勢模型載入失敗:', error.message);
                
                gestureResult.textContent = '⚠️ 手勢檢測不可用，使用表情和語音分析';
                gestureResult.style.background = '#fff3cd';
                gestureResult.style.color = '#856404';
                
                return false;
            }
        }

        // 初始化表情檢測
        async function initFaceDetection(stream) {
            video.srcObject = stream;
            
            video.addEventListener('play', () => {
                setTimeout(() => {
                    faceCanvas = faceapi.createCanvasFromMedia(video);
                    
                    const videoContainer = document.querySelector('.video-container');
                    videoContainer.appendChild(faceCanvas);
                    
                    // 獲取視頻的實際尺寸和位置
                    const videoRect = video.getBoundingClientRect();
                    const containerRect = videoContainer.getBoundingClientRect();
                    
                    // 計算視頻在容器中的偏移量
                    const offsetX = videoRect.left - containerRect.left;
                    const offsetY = videoRect.top - containerRect.top;
                    
                    faceCanvas.style.position = 'absolute';
                    faceCanvas.style.top = offsetY + 'px';
                    faceCanvas.style.left = offsetX + 'px';
                    faceCanvas.style.width = video.offsetWidth + 'px';
                    faceCanvas.style.height = video.offsetHeight + 'px';
                    faceCanvas.style.zIndex = '1';
                    faceCanvas.style.transform = 'rotateY(180deg)';
                    
                    const displaySize = { width: video.videoWidth, height: video.videoHeight };
                    faceapi.matchDimensions(faceCanvas, displaySize);
                    
                    // 監聽視頻尺寸變化，重新調整canvas位置
                    const resizeObserver = new ResizeObserver(() => {
                        if (faceCanvas && video) {
                            const videoRect = video.getBoundingClientRect();
                            const containerRect = videoContainer.getBoundingClientRect();
                            const offsetX = videoRect.left - containerRect.left;
                            const offsetY = videoRect.top - containerRect.top;
                            
                            faceCanvas.style.top = offsetY + 'px';
                            faceCanvas.style.left = offsetX + 'px';
                            faceCanvas.style.width = video.offsetWidth + 'px';
                            faceCanvas.style.height = video.offsetHeight + 'px';
                        }
                    });
                    resizeObserver.observe(video);
                    
                    // 開始表情檢測
                    faceDetectionInterval = setInterval(async () => {
                        const detections = await faceapi
                            .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                            .withFaceExpressions();
                        
                        const resized = faceapi.resizeResults(detections, displaySize);
                        faceCanvas.getContext('2d').clearRect(0, 0, faceCanvas.width, faceCanvas.height);
                        
                        if (resized.length > 0) {
                            const result = resized[0];
                            const expressions = result.expressions;
                            const topEmotion = Object.entries(expressions)
                                .sort((a, b) => b[1] - a[1])[0];
                            
                            currentFaceEmotion = {
                                emotion: topEmotion[0],
                                confidence: topEmotion[1]
                            };
                            
                            const drawBox = new faceapi.draw.DrawBox(result.detection.box, {
                                label: `${topEmotion[0]} (${(topEmotion[1] * 100).toFixed(1)}%)`
                            });
                            drawBox.draw(faceCanvas);
                            
                            faceResult.textContent = `表情：${getEmotionEmoji(topEmotion[0])} ${topEmotion[0]} (${(topEmotion[1] * 100).toFixed(1)}%)`;
                        } else {
                            faceResult.textContent = "未偵測到人臉";
                            currentFaceEmotion = { emotion: 'neutral', confidence: 0 };
                        }
                        
                        performCommunicationAnalysis();
                    }, 500);
                }, 500);
            });
        }

        // 初始化手勢檢測
        async function initGestureDetection() {
            if (!gestureRecognizer) {
                console.warn('手勢識別器未初始化');
                return;
            }

            // 創建手勢檢測的 canvas
            gestureCanvas = document.createElement('canvas');
            const videoContainer = document.querySelector('.video-container');
            videoContainer.appendChild(gestureCanvas);
            
            gestureCanvas.className = 'gesture-output-canvas';
            gestureCanvas.style.position = 'absolute';
            gestureCanvas.style.zIndex = '2';
            
            gestureDetectionActive = true;
            
            // 定位手勢canvas的函數
            const updateGestureCanvasPosition = () => {
                if (gestureCanvas && video) {
                    const videoRect = video.getBoundingClientRect();
                    const containerRect = videoContainer.getBoundingClientRect();
                    const offsetX = videoRect.left - containerRect.left;
                    const offsetY = videoRect.top - containerRect.top;
                    
                    gestureCanvas.style.top = offsetY + 'px';
                    gestureCanvas.style.left = offsetX + 'px';
                    gestureCanvas.style.width = video.offsetWidth + 'px';
                    gestureCanvas.style.height = video.offsetHeight + 'px';
                }
            };
            
            // 監聽視頻尺寸變化
            const gestureResizeObserver = new ResizeObserver(() => {
                updateGestureCanvasPosition();
            });
            gestureResizeObserver.observe(video);
            
            // 等待視頻準備好後開始檢測
            video.addEventListener('loadeddata', () => {
                updateGestureCanvasPosition();
                predictGestures();
            });
            
            if (video.readyState >= 2) {
                updateGestureCanvasPosition();
                predictGestures();
            }
        }

        // 手勢預測循環
        async function predictGestures() {
            if (!gestureDetectionActive || !gestureRecognizer) return;

            // 確保視頻已載入
            if (video.videoWidth === 0 || video.videoHeight === 0) {
                if (gestureDetectionActive) {
                    requestAnimationFrame(predictGestures);
                }
                return;
            }

            // 更新畫布尺寸和位置
            const videoRect = video.getBoundingClientRect();
            const containerRect = video.parentElement.getBoundingClientRect();
            
            gestureCanvas.width = video.videoWidth;
            gestureCanvas.height = video.videoHeight;
            gestureCanvas.style.width = video.offsetWidth + 'px';
            gestureCanvas.style.height = video.offsetHeight + 'px';

            let nowInMs = Date.now();
            let results;

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                results = gestureRecognizer.recognizeForVideo(video, nowInMs);
                
                // 分析手勢數據
                analyzeGestureData(results);
                
                // 清除畫布
                const canvasCtx = gestureCanvas.getContext('2d');
                canvasCtx.clearRect(0, 0, gestureCanvas.width, gestureCanvas.height);

                // 繪製手部骨架
                if (results.landmarks && results.landmarks.length > 0) {
                    const drawingUtils = new DrawingUtils(canvasCtx);
                    
                    for (const landmarks of results.landmarks) {
                        drawingUtils.drawConnectors(
                            landmarks,
                            GestureRecognizer.HAND_CONNECTIONS,
                            { color: "#00FF00", lineWidth: 3 }
                        );
                        drawingUtils.drawLandmarks(landmarks, {
                            color: "#FF0000",
                            lineWidth: 2,
                            radius: 4
                        });
                    }
                }
            }

            if (gestureDetectionActive) {
                requestAnimationFrame(predictGestures);
            }
        }

        // 分析手勢數據
        function analyzeGestureData(results) {
            let armsCrossed = false;
            let postureOpen = true;
            let handsVisible = false;
            let confidenceLevel = 0;
            let detectedGesture = null;

            if (results.landmarks && results.landmarks.length > 0) {
                handsVisible = true;
                confidenceLevel = 0.8;

                // 檢測具體手勢
                if (results.gestures && results.gestures.length > 0) {
                    const gesture = results.gestures[0][0];
                    const confidence = gesture.score;
                    
                    if (confidence > 0.7) {
                        detectedGesture = {
                            name: gesture.categoryName,
                            confidence: confidence
                        };
                        
                        // 根據手勢類型判斷親師溝通效果
                        switch(gesture.categoryName) {
                            case 'Open_Palm':
                                postureOpen = true;
                                armsCrossed = false;
                                break;
                            case 'Closed_Fist':
                                postureOpen = false;
                                armsCrossed = true;
                                break;
                            case 'Thumb_Up':
                                postureOpen = true;
                                armsCrossed = false;
                                break;
                            case 'Thumb_Down':
                                postureOpen = false;
                                break;
                            case 'Victory':
                                postureOpen = true;
                                armsCrossed = false;
                                break;
                        }
                    }
                }

                // 檢測手臂交叉（基於手部位置）
                if (results.landmarks.length >= 2) {
                    const leftHand = results.landmarks[0];
                    const rightHand = results.landmarks[1];
                    
                    armsCrossed = checkArmsCrossed(leftHand, rightHand);
                    if (armsCrossed) {
                        postureOpen = false;
                    }
                }
                
                // 檢測單手情況
                if (results.landmarks.length === 1) {
                    const hand = results.landmarks[0];
                    const wrist = hand[0];
                    
                    // 如果手在身體中央區域，可能是防禦性姿態
                    if (wrist.x > 0.4 && wrist.x < 0.6) {
                        postureOpen = false;
                        confidenceLevel = 0.5;
                    }
                }
            }

            // 更新手勢數據
            currentGestureData = {
                armsCrossed,
                postureOpen,
                handsVisible,
                confidenceLevel,
                detectedGesture
            };

            // 更新 UI
            updateGestureUI();
        }

        // 檢測手臂交叉
        function checkArmsCrossed(leftHand, rightHand) {
            if (!leftHand || !rightHand) return false;

            const leftWrist = leftHand[0];
            const rightWrist = rightHand[0];

            // 檢查手腕是否交叉在身體中線（注意鏡像效果）
            const wristsCrossed = leftWrist.x < 0.5 && rightWrist.x > 0.5;
            
            // 檢查手臂高度是否相近（水平交叉）
            const heightSimilar = Math.abs(leftWrist.y - rightWrist.y) < 0.1;
            
            // 檢查是否在胸部區域
            const inChestArea = leftWrist.y > 0.3 && leftWrist.y < 0.7 && 
                              rightWrist.y > 0.3 && rightWrist.y < 0.7;

            return wristsCrossed && heightSimilar && inChestArea;
        }

        // 更新手勢 UI
        function updateGestureUI() {
            const armsIndicator = document.getElementById('armsIndicator');
            const postureIndicator = document.getElementById('postureIndicator');
            const handsIndicator = document.getElementById('handsIndicator');
            const engagementIndicator = document.getElementById('engagementIndicator');

            // 手臂姿態
            const armsStatus = document.getElementById('armsStatus');
            const armsConfidence = document.getElementById('armsConfidence');
            
            // 顯示檢測到的具體手勢
            if (currentGestureData.detectedGesture) {
                const gesture = currentGestureData.detectedGesture;
                let gestureEmoji = "🤲";
                let gestureMessage = "";
                
                switch(gesture.name) {
                    case "Thumb_Up": 
                        gestureEmoji = "👍"; 
                        gestureMessage = "積極的手勢";
                        break;
                    case "Thumb_Down": 
                        gestureEmoji = "👎"; 
                        gestureMessage = "消極的手勢";
                        break;
                    case "Open_Palm": 
                        gestureEmoji = "✋"; 
                        gestureMessage = "開放的手勢";
                        break;
                    case "Closed_Fist": 
                        gestureEmoji = "✊"; 
                        gestureMessage = "緊張的手勢";
                        break;
                    case "Pointing_Up": 
                        gestureEmoji = "☝️"; 
                        gestureMessage = "指示性手勢";
                        break;
                    case "Victory": 
                        gestureEmoji = "✌️"; 
                        gestureMessage = "友善的手勢";
                        break;
                    case "ILoveYou": 
                        gestureEmoji = "🤟"; 
                        gestureMessage = "親切的手勢";
                        break;
                    default:
                        gestureEmoji = "🤲";
                        gestureMessage = "中性手勢";
                }
                
                gestureResult.textContent = `${gestureEmoji} 檢測到：${gesture.name} (${(gesture.confidence * 100).toFixed(1)}%) - ${gestureMessage}`;
                gestureResult.style.background = gesture.name === 'Closed_Fist' || gesture.name === 'Thumb_Down' ? '#ffe6e6' : '#e6ffe6';
            } else if (currentGestureData.armsCrossed) {
                armsStatus.textContent = '交叉';
                armsIndicator.className = 'indicator-card active';
                armsConfidence.style.width = '80%';
                gestureResult.textContent = '⚠️ 檢測到防禦性姿態：手臂交叉';
                gestureResult.style.background = '#ffe6e6';
            } else if (currentGestureData.postureOpen) {
                armsStatus.textContent = '開放';
                armsIndicator.className = 'indicator-card good';
                armsConfidence.style.width = `${currentGestureData.confidenceLevel * 100}%`;
                gestureResult.textContent = '✅ 姿態良好：開放的肢體語言';
                gestureResult.style.background = '#e6ffe6';
            } else {
                armsStatus.textContent = '中性';
                armsIndicator.className = 'indicator-card';
                armsConfidence.style.width = '50%';
                gestureResult.textContent = '📊 姿態分析中...';
                gestureResult.style.background = '#f8f9fa';
            }

            // 整體姿態
            document.getElementById('postureStatus').textContent = 
                currentGestureData.postureOpen ? '專業' : '需改進';
            document.getElementById('postureConfidence').style.width = 
                `${currentGestureData.confidenceLevel * 100}%`;
            postureIndicator.className = currentGestureData.postureOpen ? 
                'indicator-card good' : 'indicator-card active';

            // 手掌狀態
            document.getElementById('handsStatus').textContent = 
                currentGestureData.handsVisible ? '可見' : '隱藏';
            document.getElementById('handsConfidence').style.width = 
                currentGestureData.handsVisible ? '80%' : '20%';
            handsIndicator.className = currentGestureData.handsVisible ? 
                'indicator-card good' : 'indicator-card active';

            // 參與度
            const engagement = currentGestureData.postureOpen && currentGestureData.handsVisible;
            document.getElementById('engagementStatus').textContent = 
                engagement ? '良好' : '待改進';
            document.getElementById('engagementConfidence').style.width = 
                engagement ? '85%' : '40%';
            engagementIndicator.className = engagement ? 
                'indicator-card good' : 'indicator-card active';
        }

        // 初始化語音分析
        async function initVoiceAnalysis(stream) {
            audioStream = stream;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.8;
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            sourceNode.connect(analyser);
            analyzeAudio();
        }

        // 語音分析主循環
        function analyzeAudio() {
            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);
            
            const volume = calculateVolume(dataArray);
            const pitch = calculatePitch(dataArray);
            const energy = calculateEnergy(dataArray);
            const isVoiceActive = detectVoiceActivity(volume, energy);
            
            updateVoiceDisplay(volume, pitch, energy, isVoiceActive);
            analyzeVoiceMood(volume, pitch, energy);
            updateHistory(volume, pitch, energy);
            
            animationId = requestAnimationFrame(analyzeAudio);
        }

        // 語音特徵計算函數
        function calculateVolume(dataArray) {
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i] * dataArray[i];
            }
            return Math.sqrt(sum / dataArray.length);
        }

        function calculatePitch(dataArray) {
            let maxIndex = 0;
            let maxValue = 0;
            
            const minIndex = Math.floor(80 * bufferLength / (audioContext.sampleRate / 2));
            const maxIndexLimit = Math.floor(3000 * bufferLength / (audioContext.sampleRate / 2));
            
            for (let i = minIndex; i < maxIndexLimit && i < dataArray.length; i++) {
                if (dataArray[i] > maxValue) {
                    maxValue = dataArray[i];
                    maxIndex = i;
                }
            }
            
            const frequency = maxIndex * audioContext.sampleRate / (2 * bufferLength);
            return maxValue > 50 ? frequency : 0;
        }

        function calculateEnergy(dataArray) {
            let energy = 0;
            for (let i = 0; i < dataArray.length; i++) {
                energy += dataArray[i];
            }
            return energy / dataArray.length;
        }

        function detectVoiceActivity(volume, energy) {
            return volume > 10 && energy > 20;
        }

        // 更新語音顯示
        function updateVoiceDisplay(volume, pitch, energy, isVoiceActive) {
            const volumePercent = Math.min(volume / 50 * 100, 100);
            volumeDiv.innerHTML = `🔊 音量級別: <span class="feature-value">${volume.toFixed(1)}</span>`;
            volumeFill.style.width = `${volumePercent}%`;
            
            if (pitch > 0) {
                pitchDiv.innerHTML = `🎵 主頻率: <span class="feature-value">${pitch.toFixed(1)}</span> Hz`;
            } else {
                pitchDiv.innerHTML = `🎵 主頻率: <span class="feature-value">N/A</span> Hz`;
            }
            
            voiceActivityDiv.innerHTML = `🗣️ 語音活動: <span class="feature-value">${isVoiceActive ? '是' : '否'}</span>`;
        }

        // 語音情緒分析
        function analyzeVoiceMood(volume, pitch, energy) {
            if (volumeHistory.length < 10) return;
            
            const avgVolume = volumeHistory.reduce((a, b) => a + b, 0) / volumeHistory.length;
            const avgEnergy = energyHistory.reduce((a, b) => a + b, 0) / energyHistory.length;
            
            let voiceMood = '';
            
            if (volume > avgVolume * 1.5 && energy > avgEnergy * 1.3) {
                voiceMood = '激動';
            } else if (volume > avgVolume * 1.2 && energy > avgEnergy * 1.1) {
                voiceMood = '活躍';
            } else if (volume > 5) {
                voiceMood = '平靜';
            } else {
                voiceMood = '安靜';
            }
            
            currentVoiceEmotion = {
                emotion: voiceMood,
                energy: energy,
                volume: volume
            };
            
            voiceMoodDiv.innerHTML = `😌 語音情緒: <span class="feature-value">${voiceMood}</span>`;
        }

        // 親師溝通綜合分析
        function performCommunicationAnalysis() {
            if (!currentFaceEmotion.emotion || !currentVoiceEmotion.emotion) return;
            
            // 計算親師溝通相關指標
            const communicationMetrics = calculateCommunicationMetrics();
            
            // 更新顯示
            updateCommunicationScores(communicationMetrics);
            
            // 生成綜合評估
            const assessment = generateCommunicationAssessment(communicationMetrics);
            fusionResult.innerHTML = assessment;
        }

        // 計算親師溝通指標
        function calculateCommunicationMetrics() {
            // 親和力指數 (基於表情、語調和手勢)
            let friendliness = 0;
            if (currentFaceEmotion.emotion === 'happy') friendliness += 0.3;
            if (currentFaceEmotion.emotion !== 'angry' && currentFaceEmotion.emotion !== 'sad') friendliness += 0.1;
            if (currentVoiceEmotion.emotion === '平靜' || currentVoiceEmotion.emotion === '活躍') friendliness += 0.2;
            if (!currentGestureData.armsCrossed) friendliness += 0.1;
            
            // 根據檢測到的手勢調整親和力
            if (currentGestureData.detectedGesture) {
                const gesture = currentGestureData.detectedGesture.name;
                if (gesture === 'Thumb_Up' || gesture === 'Victory' || gesture === 'ILoveYou') {
                    friendliness += 0.3;
                } else if (gesture === 'Open_Palm') {
                    friendliness += 0.2;
                } else if (gesture === 'Thumb_Down' || gesture === 'Closed_Fist') {
                    friendliness -= 0.2;
                }
            }
            
            // 專業度指數 (基於姿態和語音穩定性)
            let professionalism = 0;
            if (currentGestureData.postureOpen) professionalism += 0.3;
            if (currentGestureData.handsVisible) professionalism += 0.2;
            if (currentVoiceEmotion.emotion === '平靜') professionalism += 0.3;
            if (currentFaceEmotion.emotion === 'neutral' || currentFaceEmotion.emotion === 'happy') professionalism += 0.1;
            
            // 根據手勢調整專業度
            if (currentGestureData.detectedGesture) {
                const gesture = currentGestureData.detectedGesture.name;
                if (gesture === 'Open_Palm' || gesture === 'Pointing_Up') {
                    professionalism += 0.1;
                } else if (gesture === 'Closed_Fist') {
                    professionalism -= 0.1;
                }
            }
            
            // 傾聽態度 (基於身體前傾、眼神接觸等)
            let listening = 0;
            if (currentGestureData.postureOpen) listening += 0.4;
            if (currentGestureData.handsVisible) listening += 0.2;
            if (currentVoiceEmotion.volume < 20) listening += 0.2; // 安靜傾聽
            if (!currentGestureData.armsCrossed) listening += 0.1;
            
            // 根據手勢調整傾聽態度
            if (currentGestureData.detectedGesture) {
                const gesture = currentGestureData.detectedGesture.name;
                if (gesture === 'Open_Palm') {
                    listening += 0.1;
                }
            }
            
            // 整體溝通效果
            const overall = (friendliness + professionalism + listening) / 3;
            
            return {
                friendliness: Math.min(Math.max(friendliness, 0), 1),
                professionalism: Math.min(Math.max(professionalism, 0), 1),
                listening: Math.min(Math.max(listening, 0), 1),
                overall: Math.min(Math.max(overall, 0), 1)
            };
        }

        // 更新溝通指標顯示
        function updateCommunicationScores(metrics) {
            document.getElementById('friendlinessScore').textContent = `${(metrics.friendliness * 100).toFixed(1)}%`;
            document.getElementById('friendlinessMeter').style.width = `${metrics.friendliness * 100}%`;
            
            document.getElementById('professionalScore').textContent = `${(metrics.professionalism * 100).toFixed(1)}%`;
            document.getElementById('professionalMeter').style.width = `${metrics.professionalism * 100}%`;
            
            document.getElementById('listeningScore').textContent = `${(metrics.listening * 100).toFixed(1)}%`;
            document.getElementById('listeningMeter').style.width = `${metrics.listening * 100}%`;
            
            document.getElementById('overallScore').textContent = `${(metrics.overall * 100).toFixed(1)}%`;
            document.getElementById('overallMeter').style.width = `${metrics.overall * 100}%`;
            
            // 根據分數調整顏色
            const overallMeter = document.getElementById('overallMeter');
            if (metrics.overall > 0.8) {
                overallMeter.style.background = '#4CAF50';
            } else if (metrics.overall > 0.6) {
                overallMeter.style.background = '#FFC107';
            } else {
                overallMeter.style.background = '#FF5722';
            }
        }

        // 生成溝通評估報告
        function generateCommunicationAssessment(metrics) {
            let assessment = '';
            let suggestions = [];
            
            // 基於整體分數給出評估
            if (metrics.overall > 0.8) {
                assessment = '🌟 <strong>優秀的親師溝通表現！</strong><br>您展現了專業、親和且具有同理心的溝通態度。';
            } else if (metrics.overall > 0.6) {
                assessment = '👍 <strong>良好的溝通表現</strong><br>整體溝通效果不錯，但仍有進步空間。';
            } else if (metrics.overall > 0.4) {
                assessment = '⚠️ <strong>溝通表現需要改進</strong><br>建議調整溝通方式以提升效果。';
            } else {
                assessment = '🚨 <strong>溝通方式需要大幅調整</strong><br>請注意您的非語言訊息可能會影響溝通效果。';
            }
            
            // 具體建議
            if (currentGestureData.armsCrossed) {
                suggestions.push('請避免手臂交叉，保持開放的身體姿態');
            }
            
            if (currentGestureData.detectedGesture) {
                const gesture = currentGestureData.detectedGesture.name;
                if (gesture === 'Closed_Fist') {
                    suggestions.push('避免握拳手勢，可能傳達緊張或對立情緒');
                } else if (gesture === 'Thumb_Down') {
                    suggestions.push('避免負面手勢，選擇更積極的表達方式');
                }
            }
            
            if (metrics.friendliness < 0.5) {
                suggestions.push('可以適度增加微笑和友善的表情');
            }
            
            if (metrics.listening < 0.5) {
                suggestions.push('注意保持專注的聆聽姿態');
            }
            
            if (currentVoiceEmotion.emotion === '激動') {
                suggestions.push('建議降低語調，保持平靜的語音');
            }
            
            if (suggestions.length > 0) {
                assessment += '<br><br><strong>改進建議：</strong><ul>';
                suggestions.forEach(suggestion => {
                    assessment += `<li>${suggestion}</li>`;
                });
                assessment += '</ul>';
            }
            
            return assessment;
        }

        // 輔助函數
        function updateHistory(volume, pitch, energy) {
            volumeHistory.push(volume);
            pitchHistory.push(pitch);
            energyHistory.push(energy);
            
            if (volumeHistory.length > historyLength) {
                volumeHistory.shift();
                pitchHistory.shift();
                energyHistory.shift();
            }
        }

        function getEmotionEmoji(emotion) {
            const emojiMap = {
                happy: '😊',
                sad: '😢',
                angry: '😠',
                fearful: '😨',
                disgusted: '🤢',
                surprised: '😲',
                neutral: '😐'
            };
            return emojiMap[emotion] || '🤔';
        }

        // 停止所有分析
        function stopAllAnalysis() {
            // 停止語音分析
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            if (sourceNode) {
                sourceNode.disconnect();
                sourceNode = null;
            }
            
            if (analyser) {
                analyser.disconnect();
                analyser = null;
            }
            
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            
            // 停止表情檢測
            if (faceDetectionInterval) {
                clearInterval(faceDetectionInterval);
                faceDetectionInterval = null;
            }
            
            // 停止手勢檢測
            gestureDetectionActive = false;
            
            if (gestureRecognizer) {
                gestureRecognizer.close();
                gestureRecognizer = null;
            }
            
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            
            // 清理 canvas
            if (faceCanvas) {
                faceCanvas.remove();
                faceCanvas = null;
            }
            
            if (gestureCanvas) {
                gestureCanvas.remove();
                gestureCanvas = null;
            }
            
            // 重置 UI
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.textContent = '⏹️ 分析已停止';
            statusDiv.className = 'status';
            faceResult.textContent = '等待攝影機啟動...';
            gestureResult.textContent = '等待手勢檢測...';
            gestureResult.style.background = '#f8f9fa';
            fusionResult.innerHTML = '正在等待數據...';
            
            // 重置指標卡片
            document.querySelectorAll('.indicator-card').forEach(card => {
                card.className = 'indicator-card';
            });
            
            // 清空歷史數據
            volumeHistory = [];
            pitchHistory = [];
            energyHistory = [];
            
            // 重置分析數據
            currentFaceEmotion = { emotion: 'neutral', confidence: 0 };
            currentVoiceEmotion = { emotion: 'calm', energy: 0, volume: 0 };
            currentGestureData = {
                armsCrossed: false,
                postureOpen: true,
                handsVisible: true,
                confidenceLevel: 0,
                detectedGesture: null
            };
        }
    </script>
