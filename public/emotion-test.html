<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙重情緒分析器</title>
    <script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            margin: 0;
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .video-section, .audio-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        
        #stopBtn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        }
        
        video {
            width: 100%;
            max-width: 400px;
            height: auto;
            border: 2px solid #667eea;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        canvas {
            position: absolute;
            border-radius: 10px;
            pointer-events: none;
        }
        
        .video-container {
            position: relative;
            display: inline-block;
        }
        
        .emotion-result {
            font-size: 1.2em;
            color: #333;
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        
        .audio-features {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .feature-item {
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .feature-value {
            font-weight: bold;
            color: #764ba2;
        }
        
        .volume-bar {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .volume-fill {
            height: 100%;
            background: linear-gradient(to right, #4CAF50, #FFC107, #FF5722);
            transition: width 0.1s;
            border-radius: 10px;
        }
        
        .combined-analysis {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }
        
        .emotion-fusion {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .emotion-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .confidence-meter {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .confidence-fill {
            height: 100%;
            background: #4CAF50;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 10px;
            color: #0066cc;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭🎙️ 非語言情緒分析器</h1>
        
        <div class="controls">
            <button id="startBtn">🚀 開始雙重分析</button>
            <button id="stopBtn" disabled>⏹️ 停止分析</button>
        </div>
        
        <div id="status" class="status">狀態：未開始</div>
        
        <div class="main-content">
            <!-- 表情分析區域 -->
            <div class="video-section">
                <h3>📹 表情分析</h3>
                <div class="video-container">
                    <video id="video" autoplay muted></video>
                </div>
                <div id="faceResult" class="emotion-result">等待攝影機啟動...</div>
            </div>
            
            <!-- 語音分析區域 -->
            <div class="audio-section">
                <h3>🎤 語音分析</h3>
                <div class="audio-features">
                    <div class="feature-item" id="volume">
                        🔊 音量級別: <span class="feature-value">0</span>
                        <div class="volume-bar">
                            <div class="volume-fill" id="volumeFill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="feature-item" id="pitch">🎵 主頻率: <span class="feature-value">N/A</span> Hz</div>
                    <div class="feature-item" id="voiceActivity">🗣️ 語音活動: <span class="feature-value">否</span></div>
                    <div class="feature-item" id="voiceMood">😌 語音情緒: <span class="feature-value">平靜</span></div>
                </div>
            </div>
            
            <!-- 綜合分析區域 -->
            <div class="combined-analysis">
                <h3>🧠 AI 情緒融合分析</h3>
                <div id="fusionResult">正在等待數據...</div>
                
                <div class="emotion-fusion">
                    <div class="emotion-card">
                        <h4>😊 快樂指數</h4>
                        <div id="happyScore">0%</div>
                        <div class="confidence-meter">
                            <div class="confidence-fill" id="happyMeter" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="emotion-card">
                        <h4>😢 悲傷指數</h4>
                        <div id="sadScore">0%</div>
                        <div class="confidence-meter">
                            <div class="confidence-fill" id="sadMeter" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="emotion-card">
                        <h4>😠 憤怒指數</h4>
                        <div id="angryScore">0%</div>
                        <div class="confidence-meter">
                            <div class="confidence-fill" id="angryMeter" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="emotion-card">
                        <h4>⚡ 活力指數</h4>
                        <div id="energyScore">0%</div>
                        <div class="confidence-meter">
                            <div class="confidence-fill" id="energyMeter" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM 元素
        const video = document.getElementById("video");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const statusDiv = document.getElementById("status");
        const faceResult = document.getElementById("faceResult");
        const volumeDiv = document.getElementById("volume");
        const pitchDiv = document.getElementById("pitch");
        const voiceActivityDiv = document.getElementById("voiceActivity");
        const voiceMoodDiv = document.getElementById("voiceMood");
        const volumeFill = document.getElementById("volumeFill");
        const fusionResult = document.getElementById("fusionResult");

        // 語音分析變數
        let audioContext, sourceNode, analyser, dataArray, bufferLength, audioStream;
        let animationId;
        let volumeHistory = [], pitchHistory = [], energyHistory = [];
        const historyLength = 30;

        // 表情分析變數
        let faceDetectionInterval;
        let canvas;

        // 情緒數據
        let currentFaceEmotion = { emotion: 'neutral', confidence: 0 };
        let currentVoiceEmotion = { emotion: 'calm', energy: 0, volume: 0 };

        // 開始分析
        startBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = '🚀 正在啟動攝影機和麥克風...';
                
                // 同時獲取攝影機和麥克風權限
                const [videoStream, micStream] = await Promise.all([
                    navigator.mediaDevices.getUserMedia({ video: true }),
                    navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: false,
                            autoGainControl: false,
                            sampleRate: 44100
                        }
                    })
                ]);

                // 載入 Face API 模型
                await loadFaceModels();
                
                // 初始化表情檢測
                await initFaceDetection(videoStream);
                
                // 初始化語音分析
                await initVoiceAnalysis(micStream);
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.textContent = '✅ 雙重分析進行中...';
                
            } catch (err) {
                statusDiv.textContent = `❌ 錯誤：${err.message}`;
                console.error('初始化失敗:', err);
            }
        });

        // 停止分析
        stopBtn.addEventListener('click', () => {
            stopAllAnalysis();
        });

        // 載入 Face API 模型
        async function loadFaceModels() {
            statusDiv.textContent = '📦 正在載入 AI 模型...';
            
            // 這裡需要你把模型文件放到正確的路徑
            // 或者使用 CDN 版本
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights'),
                faceapi.nets.faceExpressionNet.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights')
            ]);
            
            statusDiv.textContent = '✅ AI 模型載入完成';
        }

        // 初始化表情檢測
        async function initFaceDetection(stream) {
            video.srcObject = stream;
            
            video.addEventListener('play', () => {
                // 確保 video 完全載入後再創建 canvas
                setTimeout(() => {
                    canvas = faceapi.createCanvasFromMedia(video);
                    
                    // 將 canvas 插入到 video 的父容器中
                    const videoContainer = document.querySelector('.video-container');
                    videoContainer.appendChild(canvas);
                    
                    // 設定 canvas 的絕對定位，讓它覆蓋在 video 上
                    canvas.style.position = 'absolute';
                    canvas.style.top = '0';
                    canvas.style.left = '0';
                    canvas.style.width = video.offsetWidth + 'px';
                    canvas.style.height = video.offsetHeight + 'px';
                    
                    const displaySize = { width: video.videoWidth, height: video.videoHeight };
                    faceapi.matchDimensions(canvas, displaySize);
                    
                    // 開始表情檢測
                    faceDetectionInterval = setInterval(async () => {
                        const detections = await faceapi
                            .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                            .withFaceExpressions();
                        
                        const resized = faceapi.resizeResults(detections, displaySize);
                        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                        
                        if (resized.length > 0) {
                            const result = resized[0];
                            const expressions = result.expressions;
                            const topEmotion = Object.entries(expressions)
                                .sort((a, b) => b[1] - a[1])[0];
                            
                            currentFaceEmotion = {
                                emotion: topEmotion[0],
                                confidence: topEmotion[1]
                            };
                            
                            // 更新顯示
                            const drawBox = new faceapi.draw.DrawBox(result.detection.box, {
                                label: `${topEmotion[0]} (${(topEmotion[1] * 100).toFixed(1)}%)`
                            });
                            drawBox.draw(canvas);
                            
                            faceResult.textContent = `表情：${getEmotionEmoji(topEmotion[0])} ${topEmotion[0]} (${(topEmotion[1] * 100).toFixed(1)}%)`;
                        } else {
                            faceResult.textContent = "未偵測到人臉";
                            currentFaceEmotion = { emotion: 'neutral', confidence: 0 };
                        }
                        
                        // 執行情緒融合分析
                        performEmotionFusion();
                    }, 500);
                }, 500); // 延遲 500ms 確保 video 完全載入
            });
        }

        // 初始化語音分析
        async function initVoiceAnalysis(stream) {
            audioStream = stream;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.8;
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            sourceNode.connect(analyser);
            analyzeAudio();
        }

        // 語音分析主循環
        function analyzeAudio() {
            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);
            
            const volume = calculateVolume(dataArray);
            const pitch = calculatePitch(dataArray);
            const energy = calculateEnergy(dataArray);
            const isVoiceActive = detectVoiceActivity(volume, energy);
            
            updateVoiceDisplay(volume, pitch, energy, isVoiceActive);
            analyzeVoiceMood(volume, pitch, energy);
            updateHistory(volume, pitch, energy);
            
            animationId = requestAnimationFrame(analyzeAudio);
        }

        // 語音特徵計算函數
        function calculateVolume(dataArray) {
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i] * dataArray[i];
            }
            return Math.sqrt(sum / dataArray.length);
        }

        function calculatePitch(dataArray) {
            let maxIndex = 0;
            let maxValue = 0;
            
            const minIndex = Math.floor(80 * bufferLength / (audioContext.sampleRate / 2));
            const maxIndexLimit = Math.floor(3000 * bufferLength / (audioContext.sampleRate / 2));
            
            for (let i = minIndex; i < maxIndexLimit && i < dataArray.length; i++) {
                if (dataArray[i] > maxValue) {
                    maxValue = dataArray[i];
                    maxIndex = i;
                }
            }
            
            const frequency = maxIndex * audioContext.sampleRate / (2 * bufferLength);
            return maxValue > 50 ? frequency : 0;
        }

        function calculateEnergy(dataArray) {
            let energy = 0;
            for (let i = 0; i < dataArray.length; i++) {
                energy += dataArray[i];
            }
            return energy / dataArray.length;
        }

        function detectVoiceActivity(volume, energy) {
            return volume > 10 && energy > 20;
        }

        // 更新語音顯示
        function updateVoiceDisplay(volume, pitch, energy, isVoiceActive) {
            const volumePercent = Math.min(volume / 50 * 100, 100);
            volumeDiv.innerHTML = `🔊 音量級別: <span class="feature-value">${volume.toFixed(1)}</span>`;
            volumeFill.style.width = `${volumePercent}%`;
            
            if (pitch > 0) {
                pitchDiv.innerHTML = `🎵 主頻率: <span class="feature-value">${pitch.toFixed(1)}</span> Hz`;
            } else {
                pitchDiv.innerHTML = `🎵 主頻率: <span class="feature-value">N/A</span> Hz`;
            }
            
            voiceActivityDiv.innerHTML = `🗣️ 語音活動: <span class="feature-value">${isVoiceActive ? '是' : '否'}</span>`;
        }

        // 語音情緒分析
        function analyzeVoiceMood(volume, pitch, energy) {
            if (volumeHistory.length < 10) return;
            
            const avgVolume = volumeHistory.reduce((a, b) => a + b, 0) / volumeHistory.length;
            const avgEnergy = energyHistory.reduce((a, b) => a + b, 0) / energyHistory.length;
            
            let voiceMood = '';
            
            if (volume > avgVolume * 1.5 && energy > avgEnergy * 1.3) {
                voiceMood = '激動';
            } else if (volume > avgVolume * 1.2 && energy > avgEnergy * 1.1) {
                voiceMood = '活躍';
            } else if (volume > 5) {
                voiceMood = '平靜';
            } else {
                voiceMood = '安靜';
            }
            
            currentVoiceEmotion = {
                emotion: voiceMood,
                energy: energy,
                volume: volume
            };
            
            voiceMoodDiv.innerHTML = `😌 語音情緒: <span class="feature-value">${voiceMood}</span>`;
        }

        // 情緒融合分析
        function performEmotionFusion() {
            if (!currentFaceEmotion.emotion || !currentVoiceEmotion.emotion) return;
            
            // 計算各種情緒指數
            const emotions = calculateFusedEmotions();
            
            // 更新顯示
            updateEmotionScores(emotions);
            
            // 生成綜合結論
            const conclusion = generateEmotionConclusion(emotions);
            fusionResult.textContent = conclusion;
        }

        // 計算融合情緒
        function calculateFusedEmotions() {
            const faceWeight = currentFaceEmotion.confidence;
            const voiceWeight = Math.min(currentVoiceEmotion.volume / 30, 1);
            
            // 基於表情和語音特徵計算各種情緒指數
            let happy = 0, sad = 0, angry = 0, energy = 0;
            
            // 表情貢獻
            if (currentFaceEmotion.emotion === 'happy') happy += faceWeight * 0.6;
            if (currentFaceEmotion.emotion === 'sad') sad += faceWeight * 0.6;
            if (currentFaceEmotion.emotion === 'angry') angry += faceWeight * 0.6;
            
            // 語音貢獻
            if (currentVoiceEmotion.emotion === '激動') {
                energy += 0.8;
                angry += 0.3;
            } else if (currentVoiceEmotion.emotion === '活躍') {
                energy += 0.6;
                happy += 0.3;
            } else if (currentVoiceEmotion.emotion === '安靜') {
                sad += 0.2;
            }
            
            // 標準化到 0-1 範圍
            const total = happy + sad + angry + energy + 0.1; // 避免除零
            
            return {
                happy: Math.min(happy / total, 1),
                sad: Math.min(sad / total, 1),
                angry: Math.min(angry / total, 1),
                energy: Math.min(energy / total, 1)
            };
        }

        // 更新情緒分數顯示
        function updateEmotionScores(emotions) {
            document.getElementById('happyScore').textContent = `${(emotions.happy * 100).toFixed(1)}%`;
            document.getElementById('happyMeter').style.width = `${emotions.happy * 100}%`;
            
            document.getElementById('sadScore').textContent = `${(emotions.sad * 100).toFixed(1)}%`;
            document.getElementById('sadMeter').style.width = `${emotions.sad * 100}%`;
            
            document.getElementById('angryScore').textContent = `${(emotions.angry * 100).toFixed(1)}%`;
            document.getElementById('angryMeter').style.width = `${emotions.angry * 100}%`;
            
            document.getElementById('energyScore').textContent = `${(emotions.energy * 100).toFixed(1)}%`;
            document.getElementById('energyMeter').style.width = `${emotions.energy * 100}%`;
        }

        // 生成情緒結論
        function generateEmotionConclusion(emotions) {
            const maxEmotion = Object.entries(emotions).sort((a, b) => b[1] - a[1])[0];
            const [emotion, score] = maxEmotion;
            
            if (score < 0.2) {
                return "😐 情緒狀態較為平穩，沒有明顯的情緒波動";
            }
            
            const conclusions = {
                happy: `😊 綜合分析顯示您當前心情不錯，正面情緒較強 (${(score * 100).toFixed(1)}%)`,
                sad: `😢 檢測到一些低落情緒，建議適當調節心情 (${(score * 100).toFixed(1)}%)`,
                angry: `😠 似乎有些情緒激動，建議深呼吸放鬆一下 (${(score * 100).toFixed(1)}%)`,
                energy: `⚡ 活力滿滿！當前狀態很有精神 (${(score * 100).toFixed(1)}%)`
            };
            
            return conclusions[emotion] || "🤔 情緒狀態分析中...";
        }

        // 輔助函數
        function updateHistory(volume, pitch, energy) {
            volumeHistory.push(volume);
            pitchHistory.push(pitch);
            energyHistory.push(energy);
            
            if (volumeHistory.length > historyLength) {
                volumeHistory.shift();
                pitchHistory.shift();
                energyHistory.shift();
            }
        }

        function getEmotionEmoji(emotion) {
            const emojiMap = {
                happy: '😊',
                sad: '😢',
                angry: '😠',
                fearful: '😨',
                disgusted: '🤢',
                surprised: '😲',
                neutral: '😐'
            };
            return emojiMap[emotion] || '🤔';
        }

        // 停止所有分析
        function stopAllAnalysis() {
            // 停止語音分析
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            if (sourceNode) {
                sourceNode.disconnect();
                sourceNode = null;
            }
            
            if (analyser) {
                analyser.disconnect();
                analyser = null;
            }
            
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            
            // 停止表情檢測
            if (faceDetectionInterval) {
                clearInterval(faceDetectionInterval);
                faceDetectionInterval = null;
            }
            
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            
            if (canvas) {
                canvas.remove();
                canvas = null;
            }
            
            // 重置 UI
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.textContent = '⏹️ 分析已停止';
            faceResult.textContent = '等待攝影機啟動...';
            fusionResult.textContent = '正在等待數據...';
            
            // 清空歷史數據
            volumeHistory = [];
            pitchHistory = [];
            energyHistory = [];
            
            // 重置情緒數據
            currentFaceEmotion = { emotion: 'neutral', confidence: 0 };
            currentVoiceEmotion = { emotion: 'calm', energy: 0, volume: 0 };
        }
    </script>
</body>
</html>
