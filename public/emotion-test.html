<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>表情偵測測試</title>
  <script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/s05kb253j7";
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "s05kb253j7");
    </script>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      text-align: center;
      padding: 20px;
    }
    video {
      border: 2px solid #e93ae1;
      margin-top: 20px;
    }
    canvas {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
    }
    #emotionResult {
      font-size: 1.5em;
      color: #e93ae1;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h2>人臉表情情緒偵測</h2>
  <video id="video" width="480" height="360" autoplay muted></video>
  <div id="emotionResult">模型載入中...</div>

  <script>
    const video = document.getElementById("video");
    const resultBox = document.getElementById("emotionResult");

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        // 載入模型
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri("/models/tiny_face_detector"),
          faceapi.nets.faceExpressionNet.loadFromUri("/models/face_expression")
        ]);
        resultBox.innerText = "✅ 模型載入完成，啟動攝影機中...";

        // 啟動攝影機
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        video.addEventListener("play", () => {
          const canvas = faceapi.createCanvasFromMedia(video);
          document.body.append(canvas);

          const displaySize = { width: video.width, height: video.height };
          faceapi.matchDimensions(canvas, displaySize);

          setInterval(async () => {
            const detections = await faceapi
              .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
              .withFaceExpressions();

            const resized = faceapi.resizeResults(detections, displaySize);
            canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);

            if (resized.length > 0) {
              resized.forEach(result => {
                const box = result.detection.box;
                const expressions = result.expressions;
                const top = Object.entries(expressions).sort((a, b) => b[1] - a[1])[0];
                const label = `${top[0]} (${(top[1] * 100).toFixed(1)}%)`;

                // 畫框 + 標籤
                const drawBox = new faceapi.draw.DrawBox(box, { label });
                drawBox.draw(canvas);

                resultBox.innerText = `偵測到的情緒：${label}`;
              });
            } else {
              resultBox.innerText = "未偵測到人臉";
            }
          }, 500);
        });
      } catch (error) {
        console.error("初始化失敗：", error);
        resultBox.innerText = "❌ 初始化失敗：" + error.message;
      }
    });
  </script>
</body>
</html>
