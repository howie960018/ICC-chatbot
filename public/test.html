<!DOCTYPE html>
<html>
<head>
    <title>CommAI系統</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* Banner 的樣式 */
        .site-banner {
            background-color: #e93ae1; /* 粉色背景 */
            color: white; /* 文字白色 */
            text-align: center; /* 文字置中 */
            padding: 15px 20px; /* 上下內邊距 */
            font-size: 32px; /* 字體大小 */
            font-weight: bold; /* 粗體 */
            position: fixed; /* 固定在頁面頂部 */
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000; /* 保證在其他元素之上 */
            display: flex;
            justify-content: space-between; /* 左右佈局 */
            align-items: center; /* 垂直置中 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* 添加陰影效果 */
        }

        .site-banner .welcome {
            font-size: 20px;
            margin: 0;
        }

        .site-banner .logout-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .site-banner .grading-link {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 15px;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            transition: background-color 0.3s ease;
            margin-right: 10px;
        }

        .site-banner .logout-btn:hover {
            background: #d32f2f;
        }

        .content-container {
            margin-top: 80px; /* 預留空間避免被 banner 遮擋 */
        }

        /* 更新容器佈局 - 讓它更接近滿版 */
        .container {
            display: flex;
            gap: 15px; /* 減少間距 */
            max-width: 95%; /* 改為百分比寬度，接近滿版 */
            width: 95%;    /* 確保有足夠寬度 */
            margin: 0 auto;
            padding: 20px;
        }

        /* 增加側邊欄寬度，讓它們佔據更多空間 */
        #practiceSidebar {
            width: 22%; /* 增加寬度 */
            max-width: 300px; /* 增加最大寬度 */
            min-width: 200px; /* 增加最小寬度 */
            overflow-y: auto;
            border-right: 1px solid #ddd;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 錄音列表側邊欄 - 同樣增加寬度 */
        .recordings-sidebar {
            width: 22%; /* 增加寬度與左側一致 */
            max-width: 300px; /* 增加最大寬度 */
            min-width: 200px; /* 增加最小寬度 */
            overflow-y: auto;
            padding: 10px;
            border-left: 1px solid #ddd;
            box-sizing: border-box;
        }

        /* 調整主內容區域 */
        .main-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: none; /* 移除最大寬度限制 */
            min-width: 600px; /* 保持最小寬度 */
            margin: 0; /* 移除居中，讓它自然填充 */
        }
        

        
        /* 增強響應式設計 */
        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
            }
            
            #practiceSidebar, .recordings-sidebar {
                width: 100%;
                max-width: 100%;
                height: auto;
                max-height: 300px;
                position: static;
            }
            
            .main-section {
                max-width: 100%;
                min-width: unset;
            }
        }

        .technique-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .technique-link {
            display: block;
            padding: 10px 15px;
            background-color: #f5f5f5;
            color: #333;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .technique-link:hover {
            background-color: #e93ae1;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- 新增的 Banner -->
    <div class="site-banner">
        <span class="welcome" id="welcomeMessage">歡迎!</span>
        <div>
            <a href="grading-standards.html" class="grading-link">評分標準</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeXapgBUcNJtnGoJO96GTIrdBBnr7vLpAOgtVLVNbgVOMhlmw/viewform?usp=dialog" class="grading-link" target="_blank">問卷回饋</a>
            <button id="logoutButton" class="logout-btn">登出</button>
        </div>
    </div>

    <div class="content-container">
        <div class="container">
            <div id="loadingSpinner" class="spinner-overlay">
                <div class="spinner"></div>
            </div>

            <div id="practiceSidebar" class="recordings-sidebar">
                <div class="recordings-title">溝通技巧介紹</div>
                <!-- 新增顯示區域 -->
                <div class="technique-options">
                    <a href="/i-message.html" class="technique-link">我訊息</a>
                    <a href="/sandwich.html" class="technique-link">三明治溝通法</a>
                    <a href="/comprehensive.html" class="technique-link">綜合溝通技巧</a>
                </div>

                <div class="recordings-title">
                    練習紀錄
                    <span class="recordings-count" id="practicesCount"></span>
                </div>
                <ul id="practiceList"></ul>

                <!--0301更新 空練習提示 -->
                <div id="emptyPracticesGuide" class="empty-practices-message" style="display: none;">
                    <p><strong>還沒有完成的練習</strong></p>
                    <div class="guide-step">
                        <span class="guide-step-number">1</span>選擇技巧與模式
                    </div>
                    <div class="guide-step">
                        <span class="guide-step-number">2</span>點擊"開始練習"
                    </div>
                    <div class="guide-step">
                        <span class="guide-step-number">3</span>完成對話練習
                    </div>
                    <p>完成練習並獲得分析評分後，才會顯示在此處</p>
                </div>
            </div>

            <div class="main-section">
                
                <div id="techniqueIntro" class="panel" style="display: none;"></div>
                <div class="panel">
                    <select id="techniqueSelect">
                        <option value="我訊息">我訊息</option>
                        <option value="三明治溝通法">三明治溝通法</option>
                        <option value="綜合溝通技巧">綜合溝通技巧</option>
                    </select>
                    <select id="difficultySelect">
                        <option value="簡單">基礎模式</option>
                        <option value="挑戰">挑戰模式</option>
                    </select>
                    <button id="startPracticeBtn">開始練習</button>
                </div>

                <div id="scenarioDisplay" class="panel"></div>
                <div id="dialogueDisplay" class="panel"></div>

                <div class="record-controls panel">
                    <button id="startRecordBtn">開始錄音</button>
                    <button id="stopRecordBtn" disabled>停止錄音</button>
                    <div id="countdownDisplay" style="font-size: 1.2em; font-weight: bold; color: red; margin-top: 10px;"></div>
                    <div class="recording-limit-info">
                        錄音時間限制: <span class="recording-limit-value">120秒</span>
                        <span class="recording-tip">* 超過時間限制將自動停止錄音</span>
                    </div>
                </div>

                
                <div id="recordStatus" class="status"></div>
                <div id="audioPlayback" class="audio-playback" style="display: none;"></div>

                <div id="analysisDisplay" class="panel">
                    <h3>分析結果</h3>
                    <div id="analysisContent"></div>
                </div>

            </div>

            <div class="recordings-sidebar">
                <div class="recordings-title">錄音歷史</div>
                <div id="recordingsList"></div>

                <div class="feedback-section">
                    <h4>📝 學習省思紀錄</h4>
                    <div id="feedbackList" class="feedback-list">
                        <p class="no-feedback">目前尚無學習省思紀錄。</p>
                    </div>
                    <textarea id="feedbackInput" class="feedback-input" placeholder="本次練習做得好的地方、可以改進的地方或其他..."></textarea>
                    <button id="submitFeedbackBtn" class="feedback-btn">提交紀錄</button>
                </div>

            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/onboarding.js"></script>
</body>
</html>
